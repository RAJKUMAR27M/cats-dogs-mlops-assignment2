apiVersion: v1
kind: Service
metadata:
  name: cats-dogs-api-service
  namespace: default
  labels:
    app: cats-dogs-api
spec:
  selector:
    app: cats-dogs-api
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000
  type: LoadBalancer
---
# NodePort alternative for local clusters (minikube / kind)
apiVersion: v1
kind: Service
metadata:
  name: cats-dogs-api-nodeport
  namespace: default
spec:
  selector:
    app: cats-dogs-api
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 30080
  type: NodePort
