# Training hyperparameters
img_size: 224
batch_size: 32
epochs: 20
learning_rate: 0.001
dropout_rate: 0.25
patience: 5
train_split: 0.8
val_split: 0.1

# MLflow
experiment_name: cats-dogs-classification
tracking_uri: mlruns

# Data paths
data:
  raw_dir: data/raw
  processed_dir: data/processed

# Artifacts
artifacts:
  dir: artifacts
  model_path: artifacts/model/model.pt
